<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Specialty Mapper</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --border: #2a2a2a;
      --text: #e0e0e0;
      --muted: #888;
      --accent: #4f8ff7;
      --accent-hover: #3a7be0;
      --success: #34d399;
      --warning: #fbbf24;
      --danger: #f87171;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    header {
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    header p {
      color: var(--muted);
      font-size: 0.875rem;
      margin-top: 0.25rem;
    }

    .input-section {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .input-row {
      display: flex;
      gap: 0.75rem;
      align-items: flex-end;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
    }

    label {
      font-size: 0.75rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }

    textarea {
      width: 100%;
      min-height: 120px;
      padding: 0.75rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.875rem;
      resize: vertical;
      outline: none;
      transition: border-color 0.15s;
    }

    textarea:focus { border-color: var(--accent); }
    textarea::placeholder { color: #555; }

    button {
      padding: 0.75rem 1.5rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }

    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .results {
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .results-header h2 {
      font-size: 0.875rem;
      font-weight: 500;
    }

    .badge {
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      background: var(--border);
      color: var(--muted);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead th {
      text-align: left;
      padding: 0.625rem 1rem;
      font-size: 0.6875rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    tbody td {
      padding: 0.75rem 1rem;
      font-size: 0.875rem;
      border-bottom: 1px solid var(--border);
    }

    tbody tr:last-child td { border-bottom: none; }

    .confidence {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
    }

    .confidence-bar {
      width: 40px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    .confidence-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.3s;
    }

    .confidence-high .confidence-fill { background: var(--success); }
    .confidence-med .confidence-fill { background: var(--warning); }
    .confidence-low .confidence-fill { background: var(--danger); }

    .confidence-high { color: var(--success); }
    .confidence-med { color: var(--warning); }
    .confidence-low { color: var(--danger); }

    .notes {
      color: var(--muted);
      font-size: 0.8125rem;
      max-width: 250px;
    }

    .code {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.8125rem;
      background: var(--surface);
      padding: 0.125rem 0.375rem;
      border-radius: 3px;
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem;
      color: var(--muted);
      font-size: 0.875rem;
    }

    .loading::before {
      content: '';
      width: 16px;
      height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 0.75rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-state {
      padding: 3rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.875rem;
    }

    .error {
      padding: 1rem;
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid rgba(248, 113, 113, 0.3);
      border-radius: 6px;
      color: var(--danger);
      font-size: 0.875rem;
      margin-bottom: 1rem;
    }

    .footer {
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      text-align: center;
      color: var(--muted);
      font-size: 0.75rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Specialty Mapper</h1>
      <p>Map arbitrary specialty labels to NUCC taxonomy codes</p>
    </header>

    <div class="input-section">
      <div class="input-group">
        <label for="input">Specialty Input</label>
        <textarea id="input" placeholder="Enter specialty labels, one per line&#10;e.g.&#10;Cardiologist&#10;Pediatrician&#10;Psychiatrist"></textarea>
      </div>

      <div class="input-row">
        <button id="mapBtn" onclick="doMap()">Map Specialties</button>
      </div>
    </div>

    <div id="error"></div>

    <div id="results">
      <div class="empty-state">Enter specialty labels above and click "Map Specialties"</div>
    </div>

    <div class="footer">
      Powered by Tensor Fulcrum &middot; Specialty Mapping Engine
    </div>
  </div>

  <script>
    async function doMap() {
      const input = document.getElementById('input').value.trim();
      const btn = document.getElementById('mapBtn');
      const errorDiv = document.getElementById('error');
      const resultsDiv = document.getElementById('results');

      if (!input) {
        errorDiv.innerHTML = '<div class="error">Please enter at least one specialty label.</div>';
        return;
      }

      errorDiv.innerHTML = '';
      btn.disabled = true;
      btn.textContent = 'Mapping...';
      resultsDiv.innerHTML = '<div class="loading">Mapping specialties...</div>';

      try {
        const res = await fetch('/api/map', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: input }),
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({ detail: `HTTP ${res.status}` }));
          throw new Error(err.detail || 'Mapping failed');
        }

        const data = await res.json();
        renderResults(data);
      } catch (err) {
        errorDiv.innerHTML = `<div class="error">${escapeHtml(err.message)}</div>`;
        resultsDiv.innerHTML = '';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Map Specialties';
      }
    }

    function renderResults(data) {
      const resultsDiv = document.getElementById('results');
      const { results, input_count } = data;

      if (!results || !results.length) {
        resultsDiv.innerHTML = '<div class="empty-state">No results returned.</div>';
        return;
      }

      let html = `
        <div class="results">
          <div class="results-header">
            <h2>Mapping Results</h2>
            <span class="badge">${input_count} input → NUCC</span>
          </div>
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Input</th>
                <th>NUCC Code</th>
                <th>NUCC Name</th>
                <th>Confidence</th>
                <th>Notes</th>
              </tr>
            </thead>
            <tbody>`;

      results.forEach((r, i) => {
        const conf = r.confidence ?? 0;
        const confClass = conf >= 0.8 ? 'confidence-high' : conf >= 0.5 ? 'confidence-med' : 'confidence-low';
        const confPct = Math.round(conf * 100);

        html += `
              <tr>
                <td>${i + 1}</td>
                <td>${escapeHtml(r.input || '')}</td>
                <td><span class="code">${escapeHtml(r.nucc_code || '—')}</span></td>
                <td>${escapeHtml(r.nucc_name || '—')}</td>
                <td>
                  <span class="confidence ${confClass}">
                    <span class="confidence-bar"><span class="confidence-fill" style="width:${confPct}%"></span></span>
                    ${confPct}%
                  </span>
                </td>
                <td class="notes">${escapeHtml(r.notes || '')}</td>
              </tr>`;
      });

      html += `
            </tbody>
          </table>
        </div>`;

      resultsDiv.innerHTML = html;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    document.getElementById('input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        doMap();
      }
    });
  </script>
</body>
</html>
